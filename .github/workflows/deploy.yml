# NFP — automatic development deploy to the remote VPS Metro server.
#
# Trigger: every push to main
# Flow:    GitHub Actions → SSH → scripts/deploy.sh → PM2 (nfp-metro)
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   HOST      — VPS hostname or IP
#   PORT      — SSH port (optional, defaults to 22) — NOT Metro (2000)
#   USERNAME  — SSH user (e.g. ubuntu, debian, deploy, root)
#   SSH_KEY   — private key (full PEM / OpenSSH) for that user
#
# App path on the VPS (per SSH user):
#   $HOME/apps/nfp
#   $HOME/logs/nfp
#
# This is NOT a Play Store / production binary deploy.
# It only refreshes the permanent Expo Metro development server.

name: Deploy Dev Metro

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nfp-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS (Metro / PM2)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check required secrets
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PORT: ${{ secrets.PORT }}
        run: |
          set -euo pipefail
          missing=0
          for name in HOST USERNAME SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            else
              echo "Secret ${name}: present"
            fi
          done
          if [ -z "${PORT}" ]; then
            echo "Secret PORT: missing — will default to 22"
          else
            echo "Secret PORT: present (value hidden)"
            if [ "${PORT}" = "2000" ]; then
              echo "::error::Secret PORT is 2000 — that is the Metro port, not SSH. Set PORT=22 (SSH), Metro stays on 2000 via PM2."
              exit 1
            fi
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add HOST, USERNAME, SSH_KEY (and optionally PORT) under Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          # Secret PORT = SSH port only (usually 22). Metro uses 2000 separately.
          port: ${{ secrets.PORT || 22 }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          protocol: tcp
          timeout: 30s
          # Enough headroom for npm install + Metro boot + health checks.
          command_timeout: 15m
          envs: REPO_URL,BRANCH
          script: |
            set -euo pipefail

            # Install under the SSH user's home — avoids /home/deploy permission errors.
            APP_DIR="${HOME}/apps/nfp"
            LOG_DIR="${HOME}/logs/nfp"
            REPO_URL="${REPO_URL:-https://github.com/romainrun/NFP.git}"
            BRANCH="${BRANCH:-main}"

            echo "[gha] USER=$(whoami) HOME=$HOME APP_DIR=$APP_DIR"

            mkdir -p "$(dirname "$APP_DIR")" "$LOG_DIR"
            git config --global --add safe.directory "$APP_DIR" || true

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "[gha] Cloning repository into $APP_DIR"
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi

            # Sync first so we always execute the deploy script from origin/main.
            cd "$APP_DIR"
            git remote set-url origin "$REPO_URL"
            git fetch --prune origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/${BRANCH}"
            git reset --hard "origin/${BRANCH}"

            chmod +x scripts/deploy.sh
            # Login shell so PATH matches an interactive SSH session (nvm/npm/pm2).
            bash -lc "cd \"$APP_DIR\" && \
              APP_DIR=\"$APP_DIR\" LOG_DIR=\"$LOG_DIR\" REPO_URL=\"$REPO_URL\" BRANCH=\"$BRANCH\" \
              bash scripts/deploy.sh"
        env:
          REPO_URL: https://github.com/romainrun/NFP.git
          BRANCH: main
